name: publish
on:
  workflow_dispatch:
  release:
    types: [published]
permissions:
  id-token: write
  contents: read
jobs:
  pypi:
    if: github.event_name == 'workflow_dispatch' || vars.PUBLISH_PYPI == 'true'
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/formwise
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv build
      - uses: pypa/gh-action-pypi-publish@release/v1
